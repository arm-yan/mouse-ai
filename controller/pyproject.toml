[project]
name = "mouseai"
version = "0.1.0"
description = "Drive an ESP32 BLE HID mouse over USB serial"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mouseai"]
